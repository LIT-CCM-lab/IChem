stages:
  - prepare
  - build
  - release

variables:
  BUILD_DIR: build

build_images:
  stage: prepare
  tags: [IChem-tag]
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building UBI 8.8 image..."
    - podman build -f ci-containers/Containerfile.ubi -t ichem-dev:ubi8 .
    - echo "Building Ubuntu 22.04 image..."
    - podman build -f ci-containers/Containerfile.ubuntu -t ichem-dev:ubuntu .
    - echo "Building Debian 12 image..."
    - podman build -f ci-containers/Containerfile.debian -t ichem-dev:debian .
    - echo "All images built successfully."
  rules:
    - when: manual

build_all:
  stage: build
  tags: [IChem-tag]
  script:
    - mkdir -p $CI_PROJECT_DIR/$BUILD_DIR
    - |
      echo "Building with UBI 8.8..."
      podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:ubi8 \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_ubi"
    - rm -rf $CI_PROJECT_DIR/$BUILD_DIR/*
    - |
      echo "Building with Ubuntu 22.04..."
      podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:ubuntu \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_ubuntu"
    - rm -rf $CI_PROJECT_DIR/$BUILD_DIR/*
    - |
      echo "Building with Debian 12..."
      podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:debian \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_debian"
  artifacts:
    paths:
      - IChem_ubi
      - IChem_ubuntu
      - IChem_debian
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating GitLab release for tag $CI_COMMIT_TAG"
    - ls -lh IChem_*
    - release-cli create \
        --tag-name "$CI_COMMIT_TAG" \
        --name "$CI_COMMIT_TAG" \
        --description "Automated release for $CI_COMMIT_TAG" \
        --assets-path "IChem_ubi" \
        --assets-path "IChem_ubuntu" \
        --assets-path "IChem_debian"
  rules:
    - if: '$CI_COMMIT_TAG'
