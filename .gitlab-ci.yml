stages:
  - prepare
  - build
  - release

variables:
  BUILD_DIR: build

build_images:
  stage: prepare
  tags: [IChem-tag]
  script:
    - cd "$CI_PROJECT_DIR"
    - podman build -f ci-containers/Containerfile.ubi    -t ichem-dev:ubi8 .
    - podman build -f ci-containers/Containerfile.ubuntu -t ichem-dev:ubuntu .
    - podman build -f ci-containers/Containerfile.debian -t ichem-dev:debian .
  rules:
    - when: manual

build_all:
  stage: build
  tags: [IChem-tag]
  script: |
    set -e
    mkdir -p "$CI_PROJECT_DIR/$BUILD_DIR"

    podman run --rm -v "$CI_PROJECT_DIR:/IChem:Z" -w "/IChem/$BUILD_DIR" ichem-dev:ubi8 \
      bash -c 'cmake -DCMAKE_BUILD_TYPE=Release .. && make -j$(nproc) && cp IChem /IChem/IChem_ubi'
    rm -rf "$CI_PROJECT_DIR/$BUILD_DIR"/*

    podman run --rm -v "$CI_PROJECT_DIR:/IChem:Z" -w "/IChem/$BUILD_DIR" ichem-dev:ubuntu \
      bash -c 'cmake -DCMAKE_BUILD_TYPE=Release .. && make -j$(nproc) && cp IChem /IChem/IChem_ubuntu'
    rm -rf "$CI_PROJECT_DIR/$BUILD_DIR"/*

    podman run --rm -v "$CI_PROJECT_DIR:/IChem:Z" -w "/IChem/$BUILD_DIR" ichem-dev:debian \
      bash -c 'cmake -DCMAKE_BUILD_TYPE=Release .. && make -j$(nproc) && cp IChem /IChem/IChem_debian'
  artifacts:
    paths:
      - IChem_ubi
      - IChem_ubuntu
      - IChem_debian
    expire_in: 1 year
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_all
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script: |
    release-cli create \
      --name "IChem $CI_COMMIT_TAG" \
      --tag-name "$CI_COMMIT_TAG" \
      --description "Automated build for commit $CI_COMMIT_SHA  Pipeline: $CI_PIPELINE_URL" \
      --assets-link "{\"name\":\"IChem (RHEL UBI 8)\",\"url\":\"$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/IChem_ubi?job=build_all\"}" \
      --assets-link "{\"name\":\"IChem (Ubuntu)\",\"url\":\"$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/IChem_ubuntu?job=build_all\"}" \
      --assets-link "{\"name\":\"IChem (Debian)\",\"url\":\"$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/IChem_debian?job=build_all\"}"
