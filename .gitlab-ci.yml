stages:
  - prepare
  - build

variables:
  BUILD_DIR: build

build_images:
  stage: prepare
  tags: [IChem-tag]
  script:
    - cd $CI_PROJECT_DIR
    - echo "Building UBI 8.8 image..."
    - podman build -f ci-containers/Containerfile.ubi -t ichem-dev:ubi8 .
    - echo "Building Ubuntu 22.04 image..."
    - podman build -f ci-containers/Containerfile.ubuntu -t ichem-dev:ubuntu .
    - echo "Building Debian 12 image..."
    - podman build -f ci-containers/Containerfile.debian -t ichem-dev:debian .
    - echo "All images built successfully."
  rules:
    - when: manual

build_ubi:
  stage: build
  tags: [IChem-tag]
  script:
    - podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:ubi8 \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_$CI_JOB_NAME"
  artifacts:
    paths:
      - IChem_$CI_JOB_NAME
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual

build_ubuntu:
  stage: build
  tags: [IChem-tag]
  script:
    - podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:ubuntu \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_$CI_JOB_NAME"
  artifacts:
    paths:
      - IChem_$CI_JOB_NAME
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual

build_debian:
  stage: build
  tags: [IChem-tag]
  script:
    - podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:debian \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_$CI_JOB_NAME"
  artifacts:
    paths:
      - IChem_$CI_JOB_NAME
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual