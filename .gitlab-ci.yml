stages:
  - prepare
  - build
  - release

variables:
  BUILD_DIR: build

build_images:
  stage: prepare
  tags: [IChem-tag]
  script:
    - cd $CI_PROJECT_DIR
    - podman build -f ci-containers/Containerfile.ubi -t ichem-dev:ubi8 .
    - podman build -f ci-containers/Containerfile.ubuntu -t ichem-dev:ubuntu .
    - podman build -f ci-containers/Containerfile.debian -t ichem-dev:debian .
  rules:
    - when: manual

build_all:
  stage: build
  tags: [IChem-tag]
  script:
    - mkdir -p $CI_PROJECT_DIR/$BUILD_DIR
    - |
      podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:ubi8 \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_ubi"
    - rm -rf $CI_PROJECT_DIR/$BUILD_DIR/*
    - |
      podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:ubuntu \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_ubuntu"
    - rm -rf $CI_PROJECT_DIR/$BUILD_DIR/*
    - |
      podman run --rm \
        -v $CI_PROJECT_DIR:/IChem:Z \
        -w /IChem/$BUILD_DIR \
        ichem-dev:debian \
        bash -c "cmake .. && make -j\$(nproc) && cp IChem /IChem/IChem_debian"
  artifacts:
    paths:
      - IChem_ubi
      - IChem_ubuntu
      - IChem_debian
    expire_in: 1 year
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: manual

create_release:
  stage: release
  image: alpine:latest
  script:
    - apk add --no-cache curl jq
    - |
      echo "Fetching job ID for build_all at commit $CI_COMMIT_SHA"
      JOB_ID=$(curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs?scope=success" | \
        jq '.[] | select(.name=="build_all" and .commit.id=="'"$CI_COMMIT_SHA"'") | .id' | head -n1)

      echo "Resolved build_all job ID: $JOB_ID"

      release-cli create \
        --tag-name "$CI_COMMIT_TAG" \
        --name "$CI_COMMIT_TAG" \
        --description "Automated release for $CI_COMMIT_TAG" \
        --assets-link='{"name":"IChem for UBI 8.8","url":"'"$CI_PROJECT_URL"'/-/jobs/'"$JOB_ID"'/artifacts/raw/IChem_ubi"}' \
        --assets-link='{"name":"IChem for Ubuntu 22.04","url":"'"$CI_PROJECT_URL"'/-/jobs/'"$JOB_ID"'/artifacts/raw/IChem_ubuntu"}' \
        --assets-link='{"name":"IChem for Debian 12","url":"'"$CI_PROJECT_URL"'/-/jobs/'"$JOB_ID"'/artifacts/raw/IChem_debian"}'
  rules:
    - if: '$CI_COMMIT_TAG'