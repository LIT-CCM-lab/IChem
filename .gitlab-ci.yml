create_release:
  stage: release
  image: alpine:latest
  script:
    - apk add --no-cache curl jq
    - echo "Fetching successful jobs from GitLab API..."
    - |
      JOBS_JSON=$(curl --silent --header "PRIVATE-TOKEN: $API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs?scope=success")
      echo "$JOBS_JSON" | head -c 1000
      JOB_ID=$(echo "$JOBS_JSON" | jq -r '.[] | select(.name=="build_all" and .commit.id=="'"$CI_COMMIT_SHA"'") | .id' | head -n1)
      echo "Resolved build_all job ID: $JOB_ID"
      release-cli create \
        --tag-name "$CI_COMMIT_TAG" \
        --name "$CI_COMMIT_TAG" \
        --description "Automated release for $CI_COMMIT_TAG" \
        --assets-link "{\"name\":\"IChem for UBI 8.8\",\"url\":\"$CI_PROJECT_URL/-/jobs/$JOB_ID/artifacts/raw/IChem_ubi\"}" \
        --assets-link "{\"name\":\"IChem for Ubuntu 22.04\",\"url\":\"$CI_PROJECT_URL/-/jobs/$JOB_ID/artifacts/raw/IChem_ubuntu\"}" \
        --assets-link "{\"name\":\"IChem for Debian 12\",\"url\":\"$CI_PROJECT_URL/-/jobs/$JOB_ID/artifacts/raw/IChem_debian\"}"
  rules:
    - if: '$CI_COMMIT_TAG'
